name: Test bundler none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          bundler: none
      - name: Assert Ruby installed and gem works
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ] || [ ! -x "$PREFIX/bin/ruby" ]; then
            echo "FAIL: ruby not installed at prefix"
            exit 1
          fi
          ruby -v
          gem --version || { echo "FAIL: gem not working"; exit 1; }
          V="$(ruby -e 'print RUBY_VERSION')"
          case "$V" in
            3.3.*) echo "PASS" ;;
            *) echo "FAIL: expected 3.3.x got $V"; exit 1 ;;
          esac
