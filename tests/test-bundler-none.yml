name: Test setup-ruby with bundler none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-ruby
        uses: .
        with:
          ruby-version: '3.2'
          bundler: 'none'
      - name: Assert ruby-prefix output is set
        env:
          RUBY_PREFIX: ${{ steps.setup-ruby.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $RUBY_PREFIX"
          if [ -z "$RUBY_PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is set"
      - name: Assert ruby is on PATH
        run: |
          echo "Ruby version:"
          ruby --version
          if ! ruby --version | grep -q "3\.2"; then
            echo "FAIL: expected Ruby 3.2.x"
            exit 1
          fi
          echo "PASS: Ruby 3.2 is installed"
      - name: Assert ruby can run basic code
        run: |
          echo "Running basic Ruby code:"
          ruby -e 'puts "Hello from Ruby #{RUBY_VERSION}"'
          if ! ruby -e 'exit 0'; then
            echo "FAIL: ruby cannot execute code"
            exit 1
          fi
          echo "PASS: ruby can execute code"
