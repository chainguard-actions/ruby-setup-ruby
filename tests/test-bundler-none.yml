name: Test Ruby setup with bundler none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.2'
          bundler: 'none'
      - name: Assert ruby-prefix output is set
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is set to '$PREFIX'"
      - name: Assert Ruby is installed
        run: |
          echo "Ruby version:"
          ruby --version
          if ! ruby --version | grep -q "3\.2"; then
            echo "FAIL: expected Ruby 3.2.x"
            exit 1
          fi
          echo "PASS: Ruby 3.2 is installed"
      - name: Assert ruby binary is in PATH
        run: |
          RUBY_PATH=$(which ruby)
          echo "Ruby path: $RUBY_PATH"
          if [ -z "$RUBY_PATH" ]; then
            echo "FAIL: ruby not found in PATH"
            exit 1
          fi
          echo "PASS: ruby is in PATH at $RUBY_PATH"
