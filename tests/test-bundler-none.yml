name: Test Ruby setup with bundler none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-ruby
        uses: .
        with:
          ruby-version: '3.2'
          bundler: 'none'
          rubygems: 'default'
      - name: Assert ruby is installed
        run: |
          echo "Ruby version:"
          ruby --version
          if ! ruby --version | grep -q "ruby 3.2"; then
            echo "FAIL: expected Ruby 3.2 but got: $(ruby --version)"
            exit 1
          fi
          echo "PASS: Ruby 3.2 is installed"
      - name: Assert ruby-prefix output is set
        env:
          RUBY_PREFIX: ${{ steps.setup-ruby.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $RUBY_PREFIX"
          if [ -z "$RUBY_PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is $RUBY_PREFIX"
      - name: Assert ruby can run basic code
        run: |
          RESULT=$(ruby -e 'puts 1 + 1')
          echo "Ruby computation result: $RESULT"
          if [ "$RESULT" != "2" ]; then
            echo "FAIL: expected '2' but got '$RESULT'"
            exit 1
          fi
          echo "PASS: Ruby can execute code"
