name: Test setup Ruby with bundler none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-ruby
        uses: .
        continue-on-error: true
        with:
          ruby-version: '3.2'
          bundler: 'none'
          bundler-cache: 'false'
      - name: Assert ruby-prefix output or graceful failure
        env:
          PREFIX: ${{ steps.setup-ruby.outputs.ruby-prefix }}
          OUTCOME: ${{ steps.setup-ruby.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ruby-prefix: $PREFIX"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PREFIX" ]; then
              echo "FAIL: action succeeded but ruby-prefix output is empty"
              exit 1
            fi
            echo "PASS: ruby-prefix is set to '$PREFIX'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (environment not compatible with prebuilt Ruby)"
          else
            echo "PASS: outcome was '$OUTCOME', treating as acceptable"
          fi
