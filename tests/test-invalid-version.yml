name: Test invalid ruby-version fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          ruby-version: '0.0.1'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ruby-prefix: $PREFIX"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unknown version"
            exit 1
          fi
          if [ -n "$PREFIX" ]; then
            echo "FAIL: ruby-prefix should not be set on failure"
            exit 1
          fi
          echo "PASS"
