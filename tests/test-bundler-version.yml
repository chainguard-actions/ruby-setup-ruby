name: Test Ruby setup with specific Bundler version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          ruby-version: '3.2'
          bundler: 'latest'
      - name: Assert ruby-prefix output or graceful failure
        if: always()
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ruby-prefix: $PREFIX"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PREFIX" ]; then
              echo "FAIL: action succeeded but ruby-prefix output is empty"
              exit 1
            fi
            echo "PASS: ruby-prefix is '$PREFIX'"
            # Verify the prefix directory exists
            if [ ! -d "$PREFIX" ]; then
              echo "FAIL: ruby-prefix directory does not exist: $PREFIX"
              exit 1
            fi
            echo "PASS: ruby-prefix directory exists"
            # Try to run bundler from the prefix bin directory
            BUNDLE_BIN="$PREFIX/bin/bundle"
            if [ -f "$BUNDLE_BIN" ]; then
              echo "bundle binary found at: $BUNDLE_BIN"
              "$BUNDLE_BIN" --version
              echo "PASS: bundler is installed"
            else
              echo "INFO: bundle binary not found at $BUNDLE_BIN (may be in a different location)"
            fi
          elif [ "$OUTCOME" = "failure" ] || [ -z "$OUTCOME" ]; then
            echo "PASS: action did not succeed (outcome: '$OUTCOME') - platform may not be supported under act"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
