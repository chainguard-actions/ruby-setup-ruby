name: Test basic Ruby setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-ruby
        uses: .
        with:
          ruby-version: '3.2'
      - name: Assert ruby is available
        run: |
          echo "Ruby version:"
          ruby --version
          if ! ruby --version | grep -q "ruby 3.2"; then
            echo "FAIL: expected ruby 3.2 to be installed"
            exit 1
          fi
          echo "PASS: ruby 3.2 is installed"
      - name: Assert ruby-prefix output is set
        env:
          ACTUAL: ${{ steps.setup-ruby.outputs.ruby-prefix }}
        run: |
          echo "actual ruby-prefix: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          if [ ! -d "$ACTUAL" ]; then
            echo "FAIL: ruby-prefix directory does not exist: $ACTUAL"
            exit 1
          fi
          echo "PASS: ruby-prefix is set to $ACTUAL"
