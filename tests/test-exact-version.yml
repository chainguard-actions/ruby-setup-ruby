name: Test exact ruby version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3.6'
          bundler: none
      - name: Assert exact version installed
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          V="$(ruby -e 'print RUBY_VERSION')"
          echo "RUBY_VERSION: $V"
          if [ "$V" != "3.3.6" ]; then
            echo "FAIL: expected 3.3.6"
            exit 1
          fi
          case "$PREFIX" in
            *3.3.6*) ;;
            *) echo "FAIL: prefix does not contain 3.3.6"; exit 1 ;;
          esac
          echo "PASS"
