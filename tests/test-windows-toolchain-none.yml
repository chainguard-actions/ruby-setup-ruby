name: Test windows-toolchain none (ignored on Linux)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          windows-toolchain: none
          bundler: none
      - name: Assert ruby installed and on PATH
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ] || [ ! -x "$PREFIX/bin/ruby" ]; then
            echo "FAIL: invalid ruby-prefix"
            exit 1
          fi
          if [ "$(command -v ruby)" != "$PREFIX/bin/ruby" ]; then
            echo "FAIL: ruby on PATH is not from prefix"
            exit 1
          fi
          ruby -v
          echo "PASS"
