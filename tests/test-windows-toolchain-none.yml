name: Test windows-toolchain none (ignored on Linux) with cache-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          windows-toolchain: none
          cache-version: v1
          bundler-cache: 'false'
          bundler: none
      - name: Assert ruby installed
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ] || [ ! -x "$PREFIX/bin/ruby" ]; then
            echo "FAIL: ruby not found under prefix"
            exit 1
          fi
          if [ "$(command -v ruby)" != "$PREFIX/bin/ruby" ]; then
            echo "FAIL: ruby on PATH is not from ruby-prefix"
            exit 1
          fi
          V="$(ruby -e 'print RUBY_VERSION')"
          echo "RUBY_VERSION: $V"
          case "$V" in
            3.3.*) ;;
            *) echo "FAIL: expected 3.3.x"; exit 1 ;;
          esac
          echo "PASS"
