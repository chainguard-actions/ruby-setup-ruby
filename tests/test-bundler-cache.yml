name: Test Ruby setup with bundler cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Gemfile
        run: |
          cat > Gemfile << 'EOF'
          source 'https://rubygems.org'
          EOF
          cat Gemfile
      - id: setup-ruby
        uses: .
        with:
          ruby-version: '3.2'
          bundler-cache: 'true'
      - name: Assert ruby is installed
        run: |
          echo "Ruby version:"
          ruby --version
          if ! ruby --version | grep -q "3\.2"; then
            echo "FAIL: expected Ruby 3.2.x but got: $(ruby --version)"
            exit 1
          fi
          echo "PASS: Ruby 3.2 is installed"
      - name: Assert bundler is available
        run: |
          echo "Bundler version:"
          bundle --version
          if ! bundle --version > /dev/null 2>&1; then
            echo "FAIL: bundler command not available"
            exit 1
          fi
          echo "PASS: bundler is available"
      - name: Assert ruby-prefix output is set
        env:
          RUBY_PREFIX: ${{ steps.setup-ruby.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $RUBY_PREFIX"
          if [ -z "$RUBY_PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is set to $RUBY_PREFIX"
      - name: Cleanup Gemfile
        if: always()
        run: rm -f Gemfile Gemfile.lock
