name: Test setup-ruby with bundler cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Gemfile for bundler-cache test
        run: |
          cat > Gemfile << 'EOF'
          source 'https://rubygems.org'
          gem 'rake'
          EOF
          cat Gemfile
      - id: setup-ruby
        uses: .
        with:
          ruby-version: '3.2'
          bundler-cache: 'true'
      - name: Assert ruby-prefix output is set
        env:
          RUBY_PREFIX: ${{ steps.setup-ruby.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $RUBY_PREFIX"
          if [ -z "$RUBY_PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is set"
      - name: Assert ruby is on PATH
        run: |
          echo "Ruby version:"
          ruby --version
          if ! ruby --version | grep -q "3\.2"; then
            echo "FAIL: expected Ruby 3.2.x"
            exit 1
          fi
          echo "PASS: Ruby 3.2 is installed"
      - name: Assert bundled gems are available
        run: |
          echo "Checking bundle list:"
          bundle list
          if ! bundle list | grep -q "rake"; then
            echo "FAIL: rake gem not found in bundle list"
            exit 1
          fi
          echo "PASS: bundler cache installed gems correctly"
