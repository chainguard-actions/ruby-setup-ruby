name: Test Ruby setup with bundler-cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal Gemfile
        run: |
          cat > "$GITHUB_WORKSPACE/Gemfile" <<'EOF'
          source 'https://rubygems.org'
          gem 'rake'
          EOF
      - id: action
        uses: .
        with:
          ruby-version: '3.2'
          bundler-cache: 'true'
      - name: Assert ruby-prefix output is set
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is '$PREFIX'"
      - name: Assert rake gem is installed via bundle
        run: |
          if ! bundle exec rake --version > /dev/null 2>&1; then
            echo "FAIL: rake not available via bundle exec"
            exit 1
          fi
          echo "rake version: $(bundle exec rake --version)"
          echo "PASS: bundler-cache installed gems successfully"
