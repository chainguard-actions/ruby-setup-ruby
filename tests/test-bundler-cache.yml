name: Test Ruby setup with bundler cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a simple Gemfile
        run: |
          cat > Gemfile << 'EOF'
          source 'https://rubygems.org'
          gem 'json'
          EOF
          cat Gemfile
      - id: setup-ruby
        uses: .
        with:
          ruby-version: '3.2'
          bundler-cache: 'true'
      - name: Assert ruby-prefix output is set
        env:
          PREFIX: ${{ steps.setup-ruby.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is set to '$PREFIX'"
      - name: Assert ruby is available
        run: |
          ruby --version
          echo "PASS: ruby is available"
      - name: Assert bundle is available and gems are installed
        run: |
          bundle --version
          echo "PASS: bundle is available"
          bundle exec ruby -e "require 'json'; puts JSON.generate({test: true})"
          echo "PASS: json gem is available via bundle exec"
