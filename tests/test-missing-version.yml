name: Test missing ruby-version with no version files fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create empty working directory
        run: mkdir -p empty-dir
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: empty-dir
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no version is specified"
            exit 1
          fi
          echo "PASS"
