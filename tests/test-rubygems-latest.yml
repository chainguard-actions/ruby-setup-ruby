name: Test Ruby setup with latest RubyGems
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          rubygems: 'latest'
      - name: Assert ruby-prefix output is set
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is '$PREFIX'"
      - name: Assert ruby version is 3.3
        run: |
          echo "ruby version: $(ruby --version)"
          ruby --version | grep -q "ruby 3.3" || {
            echo "FAIL: expected ruby 3.3.x"
            exit 1
          }
          echo "PASS"
      - name: Assert gem is available and updated
        run: |
          echo "gem version: $(gem --version)"
          gem --version
          echo "PASS: gem is available"
