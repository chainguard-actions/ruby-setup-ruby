name: Test Ruby setup with latest RubyGems
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-ruby
        uses: .
        with:
          ruby-version: '3.3'
          rubygems: 'latest'
          bundler: 'none'
      - name: Assert ruby is installed
        run: |
          echo "Ruby version:"
          ruby --version
          if ! ruby --version | grep -q "ruby 3.3"; then
            echo "FAIL: expected ruby 3.3.x"
            exit 1
          fi
          echo "PASS: ruby 3.3.x is installed"
      - name: Assert gem is available and updated
        run: |
          echo "Gem version:"
          gem --version
          if ! gem --version > /dev/null 2>&1; then
            echo "FAIL: gem not available"
            exit 1
          fi
          echo "PASS: gem is available"
      - name: Assert ruby-prefix output is set
        env:
          RUBY_PREFIX: ${{ steps.setup-ruby.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $RUBY_PREFIX"
          if [ -z "$RUBY_PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is set to $RUBY_PREFIX"
      - name: Assert ruby binary is in prefix directory
        env:
          RUBY_PREFIX: ${{ steps.setup-ruby.outputs.ruby-prefix }}
        run: |
          echo "Checking ruby binary in prefix: $RUBY_PREFIX"
          if [ ! -f "$RUBY_PREFIX/bin/ruby" ]; then
            echo "FAIL: ruby binary not found in prefix $RUBY_PREFIX/bin/ruby"
            exit 1
          fi
          echo "PASS: ruby binary found in prefix"
