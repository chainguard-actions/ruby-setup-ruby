name: Test Ruby setup with bundler configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.1'
          bundler: 'latest'
          bundler-cache: 'false'
      - name: Assert ruby-prefix output is set
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is '$PREFIX'"
      - name: Assert ruby 3.1 is installed
        run: |
          echo "ruby version: $(ruby --version)"
          ruby --version | grep -q "ruby 3.1" || {
            echo "FAIL: expected ruby 3.1 but got: $(ruby --version)"
            exit 1
          }
          echo "PASS"
      - name: Assert bundler is available
        run: |
          echo "bundler version: $(bundle --version)"
          bundle --version || {
            echo "FAIL: bundler not available"
            exit 1
          }
          echo "PASS"
