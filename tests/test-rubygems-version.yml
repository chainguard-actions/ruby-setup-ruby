name: Test rubygems version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          rubygems: '3.5.23'
          bundler: 'none'
      - name: Assert RubyGems is at least the requested version
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          GV="$(gem --version)"
          echo "gem --version: $GV"
          if ! ruby -e 'exit(Gem::Version.new(ARGV[0]) >= Gem::Version.new("3.5.23") ? 0 : 1)' "$GV"; then
            echo "FAIL: expected RubyGems >= 3.5.23"
            exit 1
          fi
          echo "PASS"
