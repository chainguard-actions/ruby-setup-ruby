name: Test setup-ruby with latest Bundler
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-ruby
        uses: .
        with:
          ruby-version: '3.2'
          bundler: 'latest'
          token: ${{ github.token }}
      - name: Assert ruby-prefix output is set
        env:
          PREFIX: ${{ steps.setup-ruby.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is set to '$PREFIX'"
      - name: Assert bundler is installed
        run: |
          echo "Bundler version:"
          bundle --version
          if ! bundle --version > /dev/null 2>&1; then
            echo "FAIL: bundler not available"
            exit 1
          fi
          echo "PASS: bundler is available"
      - name: Assert bundler is version 2.x or 4.x
        run: |
          BUNDLER_VERSION=$(bundle --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Bundler version: $BUNDLER_VERSION"
          MAJOR=$(echo "$BUNDLER_VERSION" | cut -d. -f1)
          if [ "$MAJOR" != "2" ] && [ "$MAJOR" != "4" ]; then
            echo "FAIL: expected Bundler 2.x or 4.x, got $BUNDLER_VERSION"
            exit 1
          fi
          echo "PASS: Bundler $MAJOR.x is installed"
