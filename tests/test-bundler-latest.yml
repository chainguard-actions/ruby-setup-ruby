name: Test bundler version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          bundler: '2'
      - name: Assert bundler 2.x available
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          [ -n "$PREFIX" ] || { echo "FAIL: empty ruby-prefix"; exit 1; }
          OUT="$(bundle --version)"
          echo "bundle --version: $OUT"
          if ! echo "$OUT" | grep -qE 'Bundler version 2\.'; then
            echo "FAIL: expected Bundler 2.x"
            exit 1
          fi
          echo "PASS"
