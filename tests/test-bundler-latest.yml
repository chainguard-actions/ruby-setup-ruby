name: Test bundler latest installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          bundler: latest
      - name: Assert bundler is available and version 2+
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          BUNDLE="$(command -v bundle)" || { echo "FAIL: bundle not on PATH"; exit 1; }
          echo "bundle path: $BUNDLE"
          case "$BUNDLE" in
            "$PREFIX"/*) ;;
            *) echo "FAIL: bundle not from installed ruby prefix"; exit 1 ;;
          esac
          OUT="$(bundle --version)"
          echo "bundle --version: $OUT"
          # Bundler <4 prints "Bundler version X.Y.Z"; Bundler 4+ prints just "X.Y.Z"
          VER="$(echo "$OUT" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n1)"
          MAJOR="${VER%%.*}"
          echo "parsed version: $VER (major $MAJOR)"
          if [ -z "$MAJOR" ] || [ "$MAJOR" -lt 2 ]; then
            echo "FAIL: expected Bundler 2+"
            exit 1
          fi
          echo "PASS"
