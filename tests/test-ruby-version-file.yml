name: Test Ruby setup from .ruby-version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .ruby-version file
        run: |
          echo "3.3" > .ruby-version
          cat .ruby-version
      - id: action
        uses: .
        with:
          ruby-version: 'default'
      - name: Assert ruby-prefix output is set
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is set to '$PREFIX'"
      - name: Assert Ruby 3.3 is installed (from .ruby-version)
        run: |
          echo "Ruby version:"
          ruby --version
          if ! ruby --version | grep -q "3\.3"; then
            echo "FAIL: expected Ruby 3.3.x (from .ruby-version file)"
            exit 1
          fi
          echo "PASS: Ruby 3.3 is installed as specified in .ruby-version"
