name: Test setup-ruby reading from .ruby-version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify .ruby-version fixture exists
        run: |
          echo "Contents of tests/.ruby-version:"
          cat "$GITHUB_WORKSPACE/tests/.ruby-version"
      - id: setup-ruby
        uses: .
        with:
          working-directory: tests
          token: ${{ github.token }}
      - name: Assert ruby-prefix output is set
        env:
          PREFIX: ${{ steps.setup-ruby.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is set to '$PREFIX'"
      - name: Assert ruby 3.3 is installed
        run: |
          echo "Ruby version:"
          ruby --version
          if ! ruby --version | grep -q "ruby 3\.3"; then
            echo "FAIL: expected ruby 3.3.x from .ruby-version file"
            exit 1
          fi
          echo "PASS: ruby 3.3 is installed from .ruby-version file"
