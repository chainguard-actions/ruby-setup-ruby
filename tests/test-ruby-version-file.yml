name: Test Ruby setup from .ruby-version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-ruby
        uses: .
        with:
          working-directory: 'tests/fixtures/ruby-version-file'
          bundler: 'none'
      - name: Assert ruby 3.3 is available
        run: |
          echo "Ruby version:"
          ruby --version
          if ! ruby --version | grep -q "ruby 3.3"; then
            echo "FAIL: expected ruby 3.3.x"
            exit 1
          fi
          echo "PASS: ruby 3.3 is available"
      - name: Assert ruby-prefix output is set
        env:
          ACTUAL: ${{ steps.setup-ruby.outputs.ruby-prefix }}
        run: |
          echo "actual ruby-prefix: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is set to $ACTUAL"
      - name: Assert ruby binary is in PATH
        run: |
          RUBY_PATH=$(which ruby)
          echo "Ruby path: $RUBY_PATH"
          if [ -z "$RUBY_PATH" ]; then
            echo "FAIL: ruby not found in PATH"
            exit 1
          fi
          echo "PASS: ruby found at $RUBY_PATH"
