name: Test Ruby setup from .ruby-version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .ruby-version file
        run: |
          echo "3.2" > "$GITHUB_WORKSPACE/.ruby-version"
          cat "$GITHUB_WORKSPACE/.ruby-version"
      - id: action
        uses: .
        # ruby-version not set — action reads from .ruby-version file
      - name: Assert ruby-prefix output is set
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is '$PREFIX'"
      - name: Assert ruby version matches .ruby-version
        run: |
          echo "ruby version: $(ruby --version)"
          ruby --version | grep -q "ruby 3.2" || {
            echo "FAIL: expected ruby 3.2.x as specified in .ruby-version"
            exit 1
          }
          echo "PASS"
