name: Test Ruby setup from .ruby-version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .ruby-version file
        run: |
          echo "3.2" > .ruby-version
          cat .ruby-version
      - id: action
        uses: .
        with:
          ruby-version: '3.2'
          bundler: 'none'
      - name: Assert ruby-prefix output is set
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is '$PREFIX'"
      - name: Assert ruby is installed and correct version
        run: |
          echo "ruby version: $(ruby --version)"
          ruby --version | grep -q "ruby 3.2" || {
            echo "FAIL: expected ruby 3.2 but got: $(ruby --version)"
            exit 1
          }
          echo "PASS"
      - name: Assert ruby prefix directory exists
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "Checking prefix directory: $PREFIX"
          if [ ! -d "$PREFIX" ]; then
            echo "FAIL: ruby-prefix directory does not exist: $PREFIX"
            exit 1
          fi
          echo "PASS: prefix directory exists"
