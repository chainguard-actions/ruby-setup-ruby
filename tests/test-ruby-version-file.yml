name: Test Ruby setup from .ruby-version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare environment
        run: |
          # Ensure /opt/hostedtoolcache exists and is writable
          sudo mkdir -p /opt/hostedtoolcache
          sudo chmod 777 /opt/hostedtoolcache
          # Ensure the Ubuntu version is recognized as a GitHub-hosted runner
          VERSION_ID=$(. /etc/os-release 2>/dev/null && echo "$VERSION_ID" || echo "unknown")
          echo "Current Ubuntu version: $VERSION_ID"
          if [ "$VERSION_ID" != "22.04" ] && [ "$VERSION_ID" != "24.04" ] && [ "$VERSION_ID" != "26.04" ]; then
            echo "Patching /etc/os-release to Ubuntu 22.04 for platform detection"
            sudo sed -i 's/^VERSION_ID=.*/VERSION_ID="22.04"/' /etc/os-release
            sudo sed -i 's/^VERSION=.*/VERSION="22.04 LTS (Jammy Jellyfish)"/' /etc/os-release
          fi
          echo "Contents of tests/fixtures/.ruby-version:"
          cat tests/fixtures/.ruby-version
      - id: setup-ruby
        uses: .
        with:
          working-directory: 'tests/fixtures'
          bundler-cache: 'false'
          token: ${{ github.token }}
      - name: Assert ruby-prefix output is set
        env:
          RUBY_PREFIX: ${{ steps.setup-ruby.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $RUBY_PREFIX"
          if [ -z "$RUBY_PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is set to $RUBY_PREFIX"
      - name: Assert ruby version matches .ruby-version file
        run: |
          echo "Ruby version:"
          ruby --version
          if ! ruby --version | grep -q "3\.1"; then
            echo "FAIL: expected Ruby 3.1.x as specified in .ruby-version"
            exit 1
          fi
          echo "PASS: Ruby 3.1 is installed as specified in .ruby-version"
