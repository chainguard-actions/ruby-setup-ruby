name: Test .ruby-version file via working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure .ruby-version fixture exists
        run: |
          mkdir -p tests/fixtures/ruby-version-dir
          [ -f tests/fixtures/ruby-version-dir/.ruby-version ] || echo "3.2" > tests/fixtures/ruby-version-dir/.ruby-version
          cat tests/fixtures/ruby-version-dir/.ruby-version
      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/ruby-version-dir
          bundler: none
      - name: Assert Ruby 3.2 installed
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          V="$(ruby -e 'print RUBY_VERSION')"
          echo "RUBY_VERSION: $V"
          case "$V" in
            3.2.*) echo "PASS" ;;
            *) echo "FAIL: expected Ruby 3.2.x"; exit 1 ;;
          esac
