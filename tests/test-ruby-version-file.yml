name: Test Ruby setup from .ruby-version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .ruby-version file
        run: |
          echo "3.1" > "$GITHUB_WORKSPACE/tests/.ruby-version"
      - id: action
        uses: .
        with:
          working-directory: tests
      - name: Assert ruby-prefix output is set
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is '$PREFIX'"
      - name: Assert ruby is on PATH and correct version
        run: |
          echo "ruby version: $(ruby --version)"
          if ! ruby --version | grep -q '3\.1'; then
            echo "FAIL: expected Ruby 3.1.x"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/tests/.ruby-version"
