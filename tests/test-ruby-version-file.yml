name: Test Ruby setup from .ruby-version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .ruby-version file in working directory
        run: |
          mkdir -p tests/fixtures/ruby-version-dir
          echo "3.1" > tests/fixtures/ruby-version-dir/.ruby-version
          cat tests/fixtures/ruby-version-dir/.ruby-version
      - id: setup-ruby
        uses: .
        with:
          working-directory: tests/fixtures/ruby-version-dir
          bundler: 'none'
          bundler-cache: 'false'
      - name: Assert ruby-prefix output is set
        env:
          RUBY_PREFIX: ${{ steps.setup-ruby.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $RUBY_PREFIX"
          if [ -z "$RUBY_PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is set to $RUBY_PREFIX"
      - name: Assert ruby is on PATH and correct version
        run: |
          echo "Ruby version:"
          ruby --version
          if ! ruby --version | grep -q "^ruby 3\.1"; then
            echo "FAIL: expected Ruby 3.1.x"
            exit 1
          fi
          echo "PASS: Ruby 3.1 is installed from .ruby-version file"
