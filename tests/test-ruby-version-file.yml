name: Test Ruby setup from .ruby-version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .ruby-version file
        run: |
          echo "3.1" > .ruby-version
          cat .ruby-version
      - id: setup-ruby
        uses: .
        with:
          bundler-cache: 'false'
      - name: Assert ruby-prefix output is set
        env:
          PREFIX: ${{ steps.setup-ruby.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is set to '$PREFIX'"
      - name: Assert ruby 3.1 is available in PATH
        run: |
          echo "ruby path: $(which ruby)"
          ruby --version
          if ! ruby --version | grep -q "ruby 3.1"; then
            echo "FAIL: expected ruby 3.1.x"
            exit 1
          fi
          echo "PASS: ruby 3.1 is available"
