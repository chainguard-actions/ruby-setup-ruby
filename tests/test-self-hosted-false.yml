name: Test self-hosted false (prebuilt binaries)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          self-hosted: 'false'
      - name: Assert ruby installed
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          [ -n "$PREFIX" ] || { echo "FAIL: empty ruby-prefix"; exit 1; }
          [ -x "$PREFIX/bin/ruby" ] || { echo "FAIL: ruby missing"; exit 1; }
          V="$(ruby -e 'print RUBY_VERSION')"
          echo "RUBY_VERSION: $V"
          case "$V" in
            3.3.*) echo "PASS" ;;
            *) echo "FAIL: expected 3.3.x"; exit 1 ;;
          esac
