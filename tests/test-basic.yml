name: Test basic usage with explicit ruby-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          bundler: none
      - name: Assert ruby-prefix output and ruby on PATH
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output empty"
            exit 1
          fi
          if [ ! -x "$PREFIX/bin/ruby" ]; then
            echo "FAIL: $PREFIX/bin/ruby not found"
            exit 1
          fi
          WHICH="$(command -v ruby)"
          echo "which ruby: $WHICH"
          if [ "$WHICH" != "$PREFIX/bin/ruby" ]; then
            echo "FAIL: ruby on PATH is not from ruby-prefix"
            exit 1
          fi
          VERSION="$(ruby -e 'print RUBY_VERSION')"
          echo "RUBY_VERSION: $VERSION"
          case "$VERSION" in
            3.3.*) echo "PASS" ;;
            *) echo "FAIL: expected 3.3.x"; exit 1 ;;
          esac
