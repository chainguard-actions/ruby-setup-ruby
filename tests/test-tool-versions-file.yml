name: Test reading .tool-versions from working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/tool-versions-file
          bundler: none
      - name: Assert Ruby 3.1.6 selected from .tool-versions
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          VERSION="$(ruby -e 'print RUBY_VERSION')"
          echo "RUBY_VERSION: $VERSION"
          if [ "$VERSION" != "3.1.6" ]; then
            echo "FAIL: expected 3.1.6"
            exit 1
          fi
          case "$PREFIX" in
            *3.1.6*) echo "PASS" ;;
            *) echo "FAIL: ruby-prefix does not contain 3.1.6"; exit 1 ;;
          esac
