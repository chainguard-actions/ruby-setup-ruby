name: Test rubygems input (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          rubygems: 'default'
      - name: Assert gem available from installed ruby
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          [ -n "$PREFIX" ] || { echo "FAIL: empty ruby-prefix"; exit 1; }
          echo "which gem: $(which gem)"
          if [ "$(dirname "$(which gem)")" != "$PREFIX/bin" ]; then
            echo "FAIL: gem on PATH is not from ruby-prefix"
            exit 1
          fi
          OUT="$(gem --version)"
          echo "gem --version: $OUT"
          if ! echo "$OUT" | grep -qE '^[0-9]+\.[0-9]+'; then
            echo "FAIL: unexpected gem version output"
            exit 1
          fi
          echo "PASS"
