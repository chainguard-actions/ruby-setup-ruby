name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory with a .ruby-version file
        run: |
          mkdir -p /tmp/myapp
          echo "3.2" > /tmp/myapp/.ruby-version
      - id: action
        uses: .
        with:
          working-directory: '/tmp/myapp'
      - name: Assert ruby-prefix output is set
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is set to '$PREFIX'"
      - name: Assert ruby is on PATH
        run: |
          ruby --version
          echo "PASS: ruby is available"
