name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory with .ruby-version
        run: |
          mkdir -p /tmp/myapp
          echo "3.2" > /tmp/myapp/.ruby-version
      - id: action
        uses: .
        with:
          working-directory: '/tmp/myapp'
      - name: Assert ruby-prefix output is set
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is '$PREFIX'"
      - name: Assert ruby is available
        run: |
          ruby --version
          echo "PASS: ruby is available"
      - name: Assert ruby version matches .ruby-version file
        run: |
          RUBY_VER=$(ruby --version)
          echo "ruby version: $RUBY_VER"
          if ! echo "$RUBY_VER" | grep -q "3\.2"; then
            echo "FAIL: expected Ruby 3.2 but got: $RUBY_VER"
            exit 1
          fi
          echo "PASS: ruby version matches .ruby-version"
