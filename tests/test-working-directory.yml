name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory with .ruby-version
        run: |
          mkdir -p "$GITHUB_WORKSPACE/myapp"
          echo "3.2" > "$GITHUB_WORKSPACE/myapp/.ruby-version"
      - id: action
        uses: .
        with:
          working-directory: './myapp'
      - name: Assert ruby-prefix output is set
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert Ruby is on PATH and correct version
        run: |
          ruby --version
          RUBY_VER=$(ruby -e "puts RUBY_VERSION")
          echo "Ruby version: $RUBY_VER"
          if [[ "$RUBY_VER" != 3.2.* ]]; then
            echo "FAIL: expected Ruby 3.2.x but got $RUBY_VER"
            exit 1
          fi
          echo "PASS: correct Ruby version installed from working-directory .ruby-version"
