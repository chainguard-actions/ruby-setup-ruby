name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory with .ruby-version
        run: |
          mkdir -p /tmp/myapp
          echo "3.2" > /tmp/myapp/.ruby-version
      - id: action
        uses: .
        with:
          working-directory: '/tmp/myapp'
      - name: Assert ruby-prefix output is set
        env:
          ACTUAL: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix=$ACTUAL"
      - name: Assert ruby version matches .ruby-version file
        run: |
          ruby --version
          if ! ruby --version | grep -q '3\.2'; then
            echo "FAIL: expected Ruby 3.2 (from .ruby-version in working-directory)"
            exit 1
          fi
          echo "PASS"
